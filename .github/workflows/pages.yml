name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - js/**
      - ts/**
      - tests/**
      - tools/build_site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile TypeScript codec and declarations
        run: |
          npm ci --prefix ts
          npm run build --prefix ts
          git diff --exit-code -- js/fic.js js/fic.d.ts js/fic.LICENSES.txt site/fic.js site/fic.LICENSES.txt
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-rc.1.26425.128
      - name: Check JavaScript and .NET interoperability
        run: node tests/fic.test.mjs
      - uses: actions/configure-pages@v5
      - run: python tools/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
      - id: deployment
        uses: actions/deploy-pages@v4
